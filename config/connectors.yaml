# Live connectors. WhatsApp is configured in the panel (Źródła → WhatsApp);
# MyBed OS and dash via .env (OS_SUPABASE_*, DASH_SUPABASE_*).

gmail:
  categories:
    urgent:
      keywords:
      - pilne
      - urgent
      - ASAP
      - termin
      sender_domains: []
    to_review:
      keywords:
      - oferta
      - propozycja
      - współpraca
      sender_domains: []
    skip:
      keywords:
      - newsletter
      - potwierdzenie zamówienia
      - unsubscribe
slack:
  channels:
  - '#general'
  include_dms: false
google_calendar:
  calendar_ids:
  - primary
ideaerp:
  base_url: https://api.delta.ideaerp.pl
  env_prefix: IDEAERP
  store_mapping:
  - shop_name: Delta Industries
    currency: PLN
    display_name: mybed.pl
  - shop_name: Delta Industries
    currency: EUR
    display_name: mybed.de
  - shop_name: All Good Things
    display_name: mittohome.pl
  metrics:
  - orders_today
  - orders_yesterday
  - revenue_today
  - revenue_yesterday
  - status_breakdown
  - avg_order_value
