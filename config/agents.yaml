timezone: Europe/Warsaw

morning_briefing:
  schedule: "0 7 * * 1-5"          # Mon-Fri at 7:00
  model: claude-sonnet-4-20250514
  max_tokens: 4096
  email_lookback_hours: 13          # 18:00 previous day (13h before 7:00)
  connectors:
    - gmail
    - slack
    - asana
    - google_calendar
    - google_sheets
    - ideaerp
    - whatsapp
  outputs:
    - type: slack
      channel: "#morning-briefing"

whatsapp_sync:
  schedule: "*/5 * * * *"          # Every 5 minutes

gmail_sync:
  schedule: "*/15 * * * *"         # Every 15 minutes

calendar_sync:
  schedule: "*/30 * * * *"         # Every 30 minutes

asana_sync:
  schedule: "*/15 * * * *"         # Every 15 minutes

ideaerp_metrics:
  schedule: "0 * * * *"            # Every hour (top of hour)

daily_wrap:
  schedule: "0 16 * * 1-5"          # Mon-Fri at 16:00
  model: claude-sonnet-4-20250514
  max_tokens: 4096
  connectors:
    - google_calendar
  outputs:
    - type: slack
      channel: "#daily-wrap"

task_monitor:
  schedule: "0 9 * * 1-5"           # Mon-Fri at 9:00 only (afternoon moved to daily_wrap)
  model: claude-haiku-4-5-20251001
  max_tokens: 2048
  blocked_threshold_days: 3
  velocity_window_weeks: 4
  connectors:
    - asana
  outputs:
    - type: slack
      channel: "#task-monitor"
