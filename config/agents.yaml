# Report schedules, sections and delivery are edited in the panel
# (Studio raportów) and stored in the database — not here.
#
# Optional: override background job schedules (cron: minute hour day month day_of_week,
# Europe/Warsaw). Use day names (mon-fri), not numbers: APScheduler counts 0 = Monday.
jobs:
  whatsapp_sync: "*/5 * * * *"
  gmail_sync: "*/10 * * * *"
  calendar_sync: "*/30 * * * *"
  ideaerp_sync: "5 * * * *"
  os_people_sync: "15 */6 * * *"
  chat_digests: "20 8-20 * * *"
  topic_extraction: "40 15 * * mon-fri"
