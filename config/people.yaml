# People registry - maps names across systems for entity resolution.
# Fill in real names and IDs for your team.
#
# Each person needs:
#   display_name: Short name used in reports
#   role: Their role (operations, logistics, sales, etc.)
#   asana_name: Full name as it appears in Asana
#   slack_name: Full name as it appears in Slack
#   whatsapp_name: Name as it appears in WhatsApp
#   email_patterns: List of email addresses/patterns

people:
  # Example - replace with your real team:
  #
  # karolina:
  #   display_name: Karolina
  #   role: operations
  #   asana_name: "Karolina Kowalska"
  #   slack_name: "Karolina Kowalska"
  #   whatsapp_name: "Karolina"
  #   email_patterns: ["karolina@mybed.pl"]
