<!DOCTYPE html>
<html lang="pl" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} — Agents</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="h-full">
<div class="min-h-full flex">
    <!-- Sidebar -->
    <nav class="w-64 bg-gray-900 text-white flex flex-col min-h-screen">
        <div class="p-6">
            <h1 class="text-xl font-bold">🤖 Agents</h1>
            <p class="text-gray-400 text-sm mt-1">Panel zarządzania</p>
        </div>
        <ul class="flex-1 px-4 space-y-1">
            <li>
                <a href="/" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 {% if active == 'dashboard' %}bg-gray-800{% endif %}">
                    <span>📊</span> Dashboard
                </a>
            </li>
            <li>
                <a href="/reports" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 {% if active == 'reports' %}bg-gray-800{% endif %}">
                    <span>📝</span> Raporty
                </a>
            </li>
            <li>
                <a href="/whatsapp" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 {% if active == 'whatsapp' %}bg-gray-800{% endif %}">
                    <span>📱</span> WhatsApp
                </a>
            </li>
            <li>
                <a href="/pipeline" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 {% if active == 'pipeline' %}bg-gray-800{% endif %}">
                    <span>🔄</span> Pipeline
                </a>
            </li>
            <li>
                <a href="/connectors" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 {% if active == 'connectors' %}bg-gray-800{% endif %}">
                    <span>🔌</span> Connectory
                </a>
            </li>
            <li>
                <a href="/velocity" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 {% if active == 'velocity' %}bg-gray-800{% endif %}">
                    <span>📈</span> Velocity
                </a>
            </li>
            <li>
                <a href="/config" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 {% if active == 'config' %}bg-gray-800{% endif %}">
                    <span>⚙️</span> Konfiguracja
                </a>
            </li>
            <li>
                <a href="/logs" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 {% if active == 'logs' %}bg-gray-800{% endif %}">
                    <span>📋</span> Logi
                </a>
            </li>
        </ul>
        <div class="p-4 border-t border-gray-700">
            <a href="/logout" class="text-gray-400 hover:text-white text-sm">Wyloguj się</a>
        </div>
    </nav>

    <!-- Main content -->
    <main class="flex-1 p-8 overflow-auto">
        {% block content %}{% endblock %}
    </main>
</div>

<script>
async function runAgent(agentName) {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Uruchamiam...';
    try {
        const res = await fetch(`/api/run/${agentName}`, { method: 'POST' });
        const data = await res.json();
        if (data.status === 'started') {
            btn.textContent = 'Uruchomiono!';
            btn.classList.add('bg-green-600');
            setTimeout(() => location.reload(), 3000);
        } else {
            btn.textContent = 'Błąd';
            btn.classList.add('bg-red-600');
        }
    } catch (e) {
        btn.textContent = 'Błąd połączenia';
        btn.classList.add('bg-red-600');
    }
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
