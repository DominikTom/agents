[project]
name = "daily-agents"
version = "0.3.0"
description = "MyBed Group — AI chief of staff: chat understanding, reports, MCP knowledge base"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8,<2",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10,<4.0",
    "asyncpg>=0.29.0",
    "slack-sdk>=3.30.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
    # mcp 2.x renamed FastMCP → MCPServer; pin until the server is migrated
    "mcp[server]>=1.27.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
agents = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
