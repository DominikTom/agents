services:
  postgres:
    image: postgres:16-alpine
    container_name: agents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agents
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Only reachable from the host itself (e.g. SSH tunnel), never from the internet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web panel + MCP server
  agents:
    build: .
    container_name: daily-agents
    restart: unless-stopped
    env_file: .env
    environment:
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:3001
    command: ["uvicorn", "src.dashboard.app:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./credentials:/app/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Background jobs: ingestion, chat digests, scheduled reports
  scheduler:
    build: .
    container_name: agents-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:3001
    command: ["python", "-m", "src.main", "schedule"]
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./credentials:/app/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
      whatsapp-bridge:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    container_name: agents-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - agents

  # No published port: only the agents containers can reach it
  whatsapp-bridge:
    build: ./whatsapp-bridge
    container_name: whatsapp-bridge
    restart: unless-stopped
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN}
    volumes:
      - whatsapp-auth:/app/auth_info
      - whatsapp-data:/app/data

volumes:
  pgdata:
  whatsapp-auth:
  whatsapp-data:
  caddy-data:
  caddy-config:
