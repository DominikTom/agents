services:
  postgres:
    image: postgres:16-alpine
    container_name: agents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agents
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents"]
      interval: 5s
      timeout: 5s
      retries: 5

  agents:
    build: .
    container_name: daily-agents
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./credentials:/app/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
      whatsapp-bridge:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    container_name: agents-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - agents

  whatsapp-bridge:
    build: ./whatsapp-bridge
    container_name: whatsapp-bridge
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - whatsapp-auth:/app/auth_info
      - whatsapp-data:/app/data

volumes:
  pgdata:
  whatsapp-auth:
  whatsapp-data:
  caddy-data:
  caddy-config:
